<section class="project-links-card">
  <h2>Liens projets <span class="count">({{ links.length }})</span></h2>
  <p class="description">Accès rapide aux sites des projets mentionnés.</p>
  
  <div class="links-grid" *ngIf="links.length">
    <a *ngFor="let p of links" [href]="p.url" target="_blank" rel="noopener" class="project-link">
      <div class="link-content">
        <div class="link-header">
          <h3>{{ p.title }}</h3>
          <span class="external-icon">↗</span>
        </div>
        <p class="company" *ngIf="p.company">{{ p.company }}</p>
        <p class="url">{{ p.url }}</p>
      </div>
    </a>
  </div>
  
  <div *ngIf="!links.length" class="empty">
    <p>Aucun lien de projet disponible.</p>
  </div>
</section>
